<!DOCTYPE html>
<html lang="pt-BR">

<head >
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta de Termômetros</title> 
  <style> 


    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --vli-blue:      #0074cd;
      --vli-blue-dk:   #005fa8;
      --vli-blue-lt:   #e6f3fb;
      --vli-orange:    #e77314;
      --vli-orange-dk: #c45e0a;
      --vli-orange-lt: #fef3ea;
      --ok:            #707472;
      --ok-bg:         #e0fdeb;
      --surface:       #ffffff;
      --bg:            #f0f5fa;
      --muted:         #6b7a90;
      --border:        #dde3ec;
      --text:          #1a2332;
      --radius:        12px;
      --radius-lg:     18px;
      --shadow-sm:     0 1px 4px rgba(0,0,0,.08);
      --shadow:        0 4px 20px rgba(0,0,0,.10);
    }
    tbody tr.row-remodelado {
  animation: linha-remodelada 1.2s infinite;
}

@keyframes linha-remodelada {
  0%,100% {
    background: #edf6ff;
  }
  50% {
    background: #cfe8ff;
  }
}

    body {
      font-family: "Segoe UI", system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 60px;
    }

    .topbar {
      background: linear-gradient(135deg, #00406e 0%, var(--vli-blue) 60%, #0088e8 100%);
      padding: 0 32px;
      display: flex;
      align-items: center;
      gap: 0;
      box-shadow: 0 3px 16px rgba(0,0,0,.28);
      position: relative;
      overflow: hidden;
    }

    
    .topbar::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 5px;
      background: var(--vli-orange);
    }

    .topbar-logo {
      padding: 18px 24px 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-right: 1px solid rgba(255,255,255,.15);
      margin-right: 24px;
    }

    .topbar-logo-mark {
      width: 42px; height: 42px;
      background: var(--vli-orange);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      box-shadow: 0 2px 8px rgba(231,115,20,.40);
    }

    .topbar-brand { color: #fff; }
    .topbar-brand-name  { font-size: 1.1rem; font-weight: 800; letter-spacing: -.01em; }
    .topbar-brand-sub   { font-size: .72rem; color: rgba(255,255,255,.55); margin-top: 1px; }

    .topbar-divider { width: 1px; height: 36px; background: rgba(255,255,255,.15); margin-right: 20px; }

    .topbar-title-wrap { flex: 1; padding: 18px 0; }
    .topbar-title    { color: #fff; font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; }
    .topbar-subtitle { color: rgba(255,255,255,.55); font-size: .76rem; margin-top: 2px; }

    .topbar-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
    }

    .topbar-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,.16);
      color: #fff;
      border: 1px solid rgba(255,255,255,.24);
      text-decoration: none;
      font-size: .9rem;
      font-weight: 700;
      transition: background .2s, transform .12s;
    }

    .topbar-link:hover {
      background: rgba(255,255,255,.24);
      transform: translateY(-1px);
    }

    .procedimento-wrapper {
      position: relative;
    }

    .procedimento-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .procedimento-card {
      background: var(--surface);
      border-radius: 16px;
      box-shadow: var(--shadow);
      width: min(420px, 100%);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .procedimento-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .procedimento-option,
    .procedimento-cancel {
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: transform .12s, background .2s;
      font-family: inherit;
    }

    .procedimento-option {
      background: var(--vli-blue-lt);
      color: var(--vli-blue-dk);
    }

    .procedimento-option:hover,
    .procedimento-cancel:hover {
      transform: translateY(-1px);
    }

    .procedimento-cancel {
      background: #f2f5f9;
      color: var(--muted);
      text-align: center;
    }

    .page { max-width: 1100px; margin: 0 auto; padding: 32px 20px 0; }

    .search-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 28px 30px;
      margin-bottom: 24px;
      border-top: 3px solid var(--vli-orange);
    }

    .search-label {
      font-size: .73rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .09em;
      color: var(--muted); margin-bottom: 10px;
    }

    .search-row { display: flex; gap: 10px; flex-wrap: wrap; }

    .search-input-wrap { flex: 1; min-width: 240px; position: relative; }

    .search-icon {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%); font-size: 16px; pointer-events: none;
    }

    input[type="text"] {
      width: 100%;
      padding: 13px 14px 13px 44px;
      font-size: 15px;
      border: 2px solid var(--border);
      border-radius: 8px; outline: none;
      transition: border-color .2s, box-shadow .2s;
      color: var(--text); background: #fafbfd; font-family: inherit;
    }

    input[type="text"]:focus {
      border-color: var(--vli-blue);
      box-shadow: 0 0 0 3px rgba(0,116,205,.13);
      background: #fff;
    }

    input[type="text"]::placeholder { color: #aab5c5; }

    .btn {
      padding: 13px 24px; font-size: 15px; font-weight: 600;
      border: none; border-radius: 8px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 7px;
      transition: background .2s, transform .12s, box-shadow .2s;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--vli-orange);
      color: #fff;
      box-shadow: 0 3px 10px rgba(231,115,20,.32);
    }

    .btn-primary:hover {
      background: var(--vli-orange-dk);
      box-shadow: 0 5px 18px rgba(231,115,20,.38);
      transform: translateY(-1px);
    }

    .btn-primary:active { transform: translateY(0); }

    .btn-ghost {
      background: transparent; color: var(--muted); border: 2px solid var(--border);
    }

    .btn-ghost:hover { background: var(--bg); color: var(--text); }

    #status {
      display: inline-flex; align-items: center; gap: 7px;
      margin-top: 16px; font-size: .82rem; font-weight: 600;
      padding: 6px 14px; border-radius: 20px;
      border: 1px solid #c3e6cd; background: var(--ok-bg); color: var(--ok);
    }

    #status.loading { background: var(--vli-blue-lt); color: var(--vli-blue); border-color: #b3d7f0; }
    #status.error   { background: #fff0ef; color: #c0392b; border-color: #f5c6c2; }

  
    .stats-row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }

    .stat-chip {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 16px 20px;
      display: flex; align-items: center; gap: 14px;
      flex: 1; min-width: 155px;
      border: 1px solid var(--border);
    }

    .stat-icon {
      width: 42px; height: 42px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }

    .stat-icon.orange { background: var(--vli-orange-lt); }
    .stat-icon.blue   { background: var(--vli-blue-lt); }
    .stat-icon.green  { background: var(--ok-bg); }

    .stat-value { font-size: 1.6rem; font-weight: 800; color: var(--text); line-height: 1; }
    .stat-label { font-size: .72rem; color: var(--muted); margin-top: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }

    .section-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 24px;
    }

    .section-header {
      background: linear-gradient(135deg, #00406e 0%, var(--vli-blue) 100%);
      padding: 16px 24px;
      display: flex; align-items: center; gap: 10px;
    }

    .section-header-title {
      color: #fff; font-size: .95rem; font-weight: 700;
      flex: 1; display: flex; align-items: center; gap: 10px;
    }

    .thermo-chip {
      background: rgba(255,255,255,.18); color: #fff;
      padding: 3px 11px; border-radius: 20px;
      font-size: .85rem; font-weight: 700;
      border: 1px solid rgba(255,255,255,.28);
    }

    .section-count {
      background: var(--vli-orange);
      color: #fff; padding: 4px 12px; border-radius: 12px;
      font-size: .78rem; font-weight: 700; white-space: nowrap;
    }

    .table-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      padding: 13px 16px;
      background: #00406e;
      color: rgba(255,255,255,.80);
      font-size: .72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .07em;
      text-align: left; white-space: nowrap;
    }

    tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f5faff; }

    /* Highlight row for "Sem ronda Temp. baixa" — blue tint */
    tbody tr.row-remodelado { background: #edf6ff; }
    tbody tr.row-remodelado:hover { background: #dceefb; }

    tbody td {
      padding: 12px 16px; font-size: .9rem;
      color: var(--text); vertical-align: middle;
    }

    /* ── Tags ── */
    .tag {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 11px; border-radius: 20px;
      font-size: .78rem; font-weight: 700; white-space: nowrap;
    }

    .tag-remodelado { background: var(--vli-blue-lt); color: var(--vli-blue);   border: 1px solid #a8d4f5; }
    .tag-ok         { background: var(--ok-bg);        color: var(--ok);         border: 1px solid #c3e6cd; }
    .tag-ok-cold    { background: #a5d6a7;             color: #1b5e20;            border: 1px solid #66bb6a; }
    .tag-warn       { background: var(--vli-orange-lt); color: var(--vli-orange); border: 1px solid #f5cfa8; }

    /* ── DTQ badge (amarelo circular) ── */
    .dtq-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; border-radius: 50%;
      background: #ffea8a; color: #5a4200; font-weight: 800;
      font-size: .78rem; border: 2px solid #f5d75a; margin-left: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,.08);
    }
    .dtq-inline { width:28px; height:28px; font-size:.9rem; line-height:28px; border-width:1px; margin-left:8px; }

    /* ── Empty state ── */
    .empty-state { text-align: center; padding: 56px 24px; color: var(--muted); }
    .empty-icon  { font-size: 3.2rem; margin-bottom: 14px; }
    .empty-title { font-size: 1.05rem; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .empty-desc  { font-size: .85rem; line-height: 1.5; }

    /* ── Legend ── */
    .legend {
      display: flex; gap: 16px; flex-wrap: nowrap; align-items: center; overflow-x: auto;
      padding: 14px 24px;
      background: #fafbfd;
      border-top: 1px solid var(--border);
    }

    .legend-item { display: flex; align-items: center; gap: 7px; font-size: .78rem; color: var(--muted); }

    /* Prevent legend items from breaking into multiple lines */
    .legend-item { flex: 0 0 auto; white-space: nowrap; }


    /* ── Multiple thermometers / relationships ── */
    .multi-thermo-alert {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 17px 20px;
      margin-bottom: 20px;
      border: 1px solid #f2c98e;
      border-left: 5px solid var(--vli-orange);
      border-radius: var(--radius);
      background: #fff8ed;
      box-shadow: var(--shadow-sm);
    }

    .multi-thermo-alert-icon {
      font-size: 1.35rem;
      line-height: 1;
      margin-top: 2px;
    }

    .multi-thermo-alert-content { min-width: 0; }

    .multi-thermo-alert-title {
      color: #8b4a08;
      font-size: .95rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .multi-thermo-alert-text {
      color: #6b4a27;
      font-size: .84rem;
      line-height: 1.55;
    }

    .section-header-title-wrap {
      flex: 1;
      min-width: 0;
    }

    .thermo-section + .thermo-section { margin-top: 20px; }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .topbar { padding: 0 16px; flex-wrap: wrap; }
      .topbar-logo { padding: 14px 16px 14px 12px; margin-right: 12px; }
      .search-card { padding: 20px 16px; }
    }

  </style>
  <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>

<!-- ══ TOP BAR ══════════════════════════════════════════ -->
<div class="topbar">
  <div class="topbar-logo">
    <div class="topbar-logo-mark"> <img src="images.jpg" alt="logo" style="height: 80px;;width: auto;"> </div>
    <div class="topbar-brand">
      <div class="topbar-brand-name"></div>
      <div class="topbar-brand-sub"></div>
    </div>
  </div>
  <div class="topbar-divider"></div>
  <div class="topbar-title-wrap">
    <div class="topbar-title">Consulta de Termômetros</div>
    <div class="topbar-subtitle">Tratar Ocorrências de Variações de Temperaturas na Via</div>
  </div>
  <div class="topbar-actions">
    <div class="procedimento-wrapper">
      <button class="topbar-link" type="button" onclick="abrirSeletorProcedimento()">Procedimento</button>
      <div id="procedimentoModal" class="procedimento-modal" role="dialog" aria-modal="true" aria-label="Escolha o procedimento">
        <div class="procedimento-card">
          <div class="procedimento-title">Escolha o documento</div>

<button class="procedimento-option" type="button"
        onclick="abrirProcedimento('PRO-000011-V18.pdf')">📄 PRO-000011-V18.pdf </button>

<button class="procedimento-cancel" type="button"
        onclick="fecharSeletorProcedimento()">
    Fechar
</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ══ PAGE ═════════════════════════════════════════════ -->
<div class="page">

  <!-- Search -->
  <div class="search-card">
    <div class="search-label">Identificador do Termômetro</div>
    <div class="search-row">
      <div class="search-input-wrap">
        <span class="search-icon">🔎</span>
        <input type="text" id="termometro"
               placeholder="Ex: EAX, EDV, ZMM…"
               list="listaTermometros"
               autocomplete="off" spellcheck="false" />
        <datalist id="listaTermometros"></datalist>
      </div>
      <button class="btn btn-primary" onclick="buscar()">🔍 Pesquisar</button>
      <button class="btn btn-ghost"   onclick="limpar()">✕ Limpar</button>
    </div>
    <div id="status" class="loading">⏳ Carregando dados…</div>
  </div>

  <!-- Stats (hidden until search) -->
  <div class="stats-row" id="statsRow" style="display:none">
    <div class="stat-chip">
      <div class="stat-icon orange">🌡️</div>
      <div><div class="stat-value" id="statTotal">0</div>
           <div class="stat-label">Trechos encontrados</div></div>
    </div>
    <div class="stat-chip">
      <div class="stat-icon blue">🔵</div>
      <div><div class="stat-value" id="statRemodelado">0</div>
           <div class="stat-label">Trechos remodelados</div></div>
    </div>
    <div class="stat-chip">
      <div class="stat-icon green">🚆</div>
      <div><div class="stat-value" id="statOk">0</div>
           <div class="stat-label">Necessário ronda</div></div>
    </div>
  </div>

  <!-- Results -->
  <div id="resultado"></div>

</div>

<script>
  let dados = [];

  const dtqList = [];

  const indiceTermometro = new Map();
  const indiceSB = new Map();
  const sbValidas = new Set();
  const SBS_ESPECIAIS = new Set(["ET2","EI2","EE2","ZG2","NL1","NL2","NL3","NL4"]);
  const mapaVinculosManuais = new Map();

  /*
   * Relações hierárquicas conhecidas entre termômetros.
   * Formato: TERMÔMETRO_VINCULADO: TERMÔMETRO_PRINCIPAL
   *
   * A relação também pode ser informada diretamente no dados.json usando
   * uma das propriedades: termometroPrincipal, termometro_principal,
   * vinculadoA ou vinculado_a. O valor presente no JSON tem prioridade.
   */
  const vinculosTermometros = {
    /*
     * Campo opcional para vínculos que estejam declarados oficialmente,
     * mas não possuam uma SB composta na base. A identificação normal de
     * trechos compartilhados agora é automática e segura para toda busca.
     */
  };

  function extrairSBs(valor) {
    const codigo = String(valor || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (codigo.length < 2) return [];

    function tentar(texto) {
      if (texto.length < 2) return [];

      for (let tamanho = Math.min(3, texto.length); tamanho >= 2; tamanho--) {
        const parte = texto.slice(0, tamanho);
        if (sbValidas.has(parte) || SBS_ESPECIAIS.has(parte)) {
          return [parte, ...tentar(texto.slice(tamanho))];
        }
      }

      const semNumerosFinais = texto.replace(/[0-9]+$/, "");
      if (semNumerosFinais.length !== texto.length) {
        return tentar(semNumerosFinais);
      }

      if (texto.length >= 3) {
        const grupos = [];
        for (let i = 0; i <= texto.length - 3; i += 3) {
          grupos.push(texto.slice(i, i + 3));
        }
        return grupos;
      }

      return [];
    }

    return tentar(codigo);
  }

  function construirMapaVinculosManuais() {
    mapaVinculosManuais.clear();

    Object.entries(vinculosTermometros).forEach(([vinculado, principais]) => {
      const lista = Array.isArray(principais) ? principais : [principais];
      lista.forEach(principal => {
        const filho = normalizarTexto(vinculado);
        const pai = normalizarTexto(principal);
        if (!filho || !pai || filho === pai) return;
        if (!mapaVinculosManuais.has(filho)) mapaVinculosManuais.set(filho, new Set());
        mapaVinculosManuais.get(filho).add(pai);
      });
    });

    dados.forEach(item => {
      const filho = normalizarTexto(item.termometro);
      const pai = obterTermometroPrincipal(item);
      if (!filho || !pai || filho === pai) return;
      if (!mapaVinculosManuais.has(filho)) mapaVinculosManuais.set(filho, new Set());
      mapaVinculosManuais.get(filho).add(pai);
    });
  }

  function normalizarTexto(valor) {
    return String(valor || "").trim().toUpperCase();
  }

  function adicionarAoIndiceTermometro(codigo, item) {
    if (!indiceTermometro.has(codigo)) indiceTermometro.set(codigo, []);
    indiceTermometro.get(codigo).push(item);
  }

  function adicionarAoIndiceSB(sb, codigo) {
    if (!sb) return;
    if (!indiceSB.has(sb)) indiceSB.set(sb, new Set());
    indiceSB.get(sb).add(codigo);
  }

  function construirIndices() {
    indiceTermometro.clear();
    indiceSB.clear();
    sbValidas.clear();
    construirMapaVinculosManuais();

    dados.forEach(item => {
      const codigo = normalizarTexto(item.termometro);
      if (!codigo) return;

      adicionarAoIndiceTermometro(codigo, item);
      adicionarAoIndiceSB(codigo, codigo);
      sbValidas.add(codigo);
    });

    dados.forEach(item => {
      const trecho = String(item.trecho || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
      const partes = [];

      for (let i = 0; i + 2 < trecho.length; i += 3) {
        const parte = trecho.slice(i, i + 3);
        if (parte.length === 3) partes.push(parte);
      }

      partes.forEach(parte => {
        if (sbValidas.has(parte) || SBS_ESPECIAIS.has(parte)) {
          adicionarAoIndiceSB(parte, normalizarTexto(item.termometro));
        }
      });
    });

    dados.forEach(item => {
      const codigo = normalizarTexto(item.termometro);
      const sbs = extrairSBs(item.trecho);
      sbs.forEach(sb => adicionarAoIndiceSB(sb, codigo));
    });
  }

  function expandirVinculosManuais(codigos) {
    const resultado = new Set();
    const fila = [...codigos].map(normalizarTexto).filter(Boolean);

    while (fila.length > 0) {
      const atual = fila.shift();
      if (resultado.has(atual)) continue;
      resultado.add(atual);

      const pais = mapaVinculosManuais.get(atual);
      if (pais) {
        pais.forEach(principal => {
          if (!resultado.has(principal)) fila.push(principal);
        });
      }
    }

    return resultado;
  }

  function obterTermometrosRelacionados(codigosPesquisa) {
    const resultados = new Set();
    const buscas = [...new Set(codigosPesquisa.map(normalizarTexto).filter(Boolean))];

    buscas.forEach(busca => {
      const termometros = indiceSB.get(busca);
      if (termometros) {
        termometros.forEach(termometro => resultados.add(termometro));
      }
    });

    expandirVinculosManuais(resultados).forEach(termometro => resultados.add(termometro));
    return resultados;
  }

  function obterRegistrosPorTermometros(termometros) {
    const registros = [];
    termometros.forEach(codigo => {
      const itens = indiceTermometro.get(normalizarTexto(codigo));
      if (Array.isArray(itens)) registros.push(...itens);
    });
    return removerRegistrosDuplicados(registros);
  }

  function construirMapaVinculos() {
    const mapa = new Map();

    mapaVinculosManuais.forEach((principais, vinculado) => {
      if (!mapa.has(vinculado)) mapa.set(vinculado, new Set());
      principais.forEach(principal => mapa.get(vinculado).add(principal));
    });

    dados.forEach(item => {
      const filho = normalizarTexto(item.termometro);
      const pai = obterTermometroPrincipal(item);
      if (!filho || !pai || filho === pai) return;
      if (!mapa.has(filho)) mapa.set(filho, new Set());
      mapa.get(filho).add(pai);
    });

    return mapa;
  }

  function chaveRegistro(item) {
    return [
      normalizarTexto(item && item.corredor),
      normalizarTexto(item && item.termometro),
      normalizarTexto(item && item.trecho),
      normalizarTexto(item && item.ronda),
      String((item && item.dtq) ?? ""),
      normalizarTexto(item && (
        item.termometroPrincipal ||
        item.termometro_principal ||
        item.vinculadoA ||
        item.vinculado_a
      ))
    ].join("|");
  }

  function removerRegistrosDuplicados(lista) {
    const unicos = new Map();

    (lista || []).forEach(item => {
      if (!item || typeof item !== "object") return;
      const chave = chaveRegistro(item);
      if (!unicos.has(chave)) unicos.set(chave, item);
    });

    return [...unicos.values()];
  }

  async function carregarArquivoJson(arquivo) {
    const separador = arquivo.includes("?") ? "&" : "?";
    const url = arquivo + separador + "v=" + Date.now();
    const resp = await fetch(url, { cache: "no-store" });

    if (!resp.ok) throw new Error(arquivo + ": HTTP " + resp.status);

    const conteudo = await resp.json();
    if (!Array.isArray(conteudo)) {
      throw new Error(arquivo + ": formato de dados inválido");
    }

    return conteudo;
  }

  async function carregarDados() {
    const el = document.getElementById("status");

    /*
     * base.json é a fonte oficial e tem prioridade absoluta. Quando ele
     * estiver disponível, nenhum arquivo antigo será misturado à pesquisa.
     */
    try {
      const baseOficial = await carregarArquivoJson("base.json");
      dados = removerRegistrosDuplicados(baseOficial);
      el.className = "";
      el.innerHTML = "Dados de acordo com o PRO-000011 V18";
      construirIndices();
      preencherLista();
      return;
    } catch (erroBase) {
      console.warn("base.json não disponível; usando bases alternativas.", erroBase);
    }

    /* Compatibilidade com instalações que ainda utilizam os nomes antigos. */
    const arquivosAlternativos = ["dados.json", "dados(1).json"];
    const resultados = await Promise.allSettled(
      arquivosAlternativos.map(carregarArquivoJson)
    );

    const basesValidas = resultados
      .filter(resultado => resultado.status === "fulfilled")
      .map(resultado => resultado.value);

    if (basesValidas.length === 0) {
      resultados.forEach(resultado => {
        if (resultado.status === "rejected") console.error(resultado.reason);
      });

      el.className = "error";
      el.innerHTML = "❌ Erro ao carregar a base de dados — verifique base.json.";
      return;
    }

    dados = removerRegistrosDuplicados(basesValidas.flat());
    el.className = "";
    el.innerHTML = "Dados de acordo com o PRO-000011 V18";
    construirIndices();
    preencherLista();
  }

  function preencherLista() {
    const lista = document.getElementById("listaTermometros");
    lista.innerHTML = "";

    [...new Set(dados.map(x => normalizarTexto(x.termometro)).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b, "pt-BR"))
      .forEach(t => {
        const opt = document.createElement("option");
        opt.value = t;
        lista.appendChild(opt);
      });
  }

  /* Trecho remodelado = sem necessidade de inspeção */
  function isRemodelado(item) {
    const r = (item.ronda || "").toLowerCase();
    return r.includes("sem ronda") || r.includes("temp. baixa") ||
           r.includes("temp baixa") || r.includes("baixa") || r === "";
  }

  function esc(s) {
    return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;")
                            .replace(/>/g,"&gt;").replace(/"/g,"&quot;")
                            .replace(/'/g,"&#039;");
  }

  function rondaTag(item) {
    if (isRemodelado(item))
      return '<span class="tag tag-remodelado">🔵 Trecho Remodelado</span>';

    const r = (item.ronda || "").toLowerCase();
    if (r.includes("parcial") || r.includes("pendente"))
      return '<span class="tag tag-warn">🕐 ' + esc(item.ronda) + "</span>";

    if (r.includes("temperatura ≤ 6 °c"))
      return '<span class="tag tag-ok-cold">🚆 ' + esc(item.ronda) + "</span>";

    return '<span class="tag tag-ok">🚆 ' + esc(item.ronda) + "</span>";
  }

  function isDTQ(item) {
    if (item && (item.dtq === true || item.dtq === "true")) return true;
    const t = normalizarTexto(item && item.trecho);
    return dtqList.map(x => normalizarTexto(x)).includes(t);
  }

  function dtqInlineTag(item) {
    if (!isDTQ(item)) return "";
    return '<span class="dtq-badge dtq-inline" title="DTQ">DTQ</span>';
  }

  function normalizarTexto(valor) {
    return String(valor || "").trim().toUpperCase();
  }

  function obterTermometroPrincipal(itemOuCodigo) {
    const item = typeof itemOuCodigo === "object" && itemOuCodigo !== null
      ? itemOuCodigo
      : null;

    const codigo = normalizarTexto(item ? item.termometro : itemOuCodigo);
    const principalInformado = item && (
      item.termometroPrincipal ||
      item.termometro_principal ||
      item.vinculadoA ||
      item.vinculado_a
    );

    return normalizarTexto(principalInformado || vinculosTermometros[codigo] || "");
  }

  function encontrarResultados(termo) {
    const termosPesquisa = extrairSBs(termo);
    if (termosPesquisa.length === 0) return [];

    const termometros = obterTermometrosRelacionados(termosPesquisa);
    if (termometros.size === 0) return [];

    return obterRegistrosPorTermometros(termometros);
  }

  function agruparPorTermometro(resultados) {
    const grupos = new Map();
    const mapaVinculos = construirMapaVinculos();

    resultados.forEach(item => {
      const codigo = normalizarTexto(item.termometro) || "NÃO INFORMADO";

      const principaisDoMapa = mapaVinculos.get(codigo);
      const principalDoMapa = principaisDoMapa && principaisDoMapa.size
        ? [...principaisDoMapa].sort((a, b) => a.localeCompare(b, "pt-BR"))[0]
        : "";

      if (!grupos.has(codigo)) {
        grupos.set(codigo, {
          codigo,
          principal: principalDoMapa || obterTermometroPrincipal(item),
          itens: []
        });
      }

      const grupo = grupos.get(codigo);
      grupo.itens.push(item);

      /* Caso o primeiro registro não tenha metadado, aproveita outro do grupo. */
      if (!grupo.principal) {
        grupo.principal = principalDoMapa || obterTermometroPrincipal(item);
      }
    });

    return [...grupos.values()].sort((a, b) => {
      const aVinculado = Boolean(a.principal);
      const bVinculado = Boolean(b.principal);

      if (aVinculado !== bVinculado) return aVinculado ? 1 : -1;
      if (a.principal !== b.principal) {
        return a.principal.localeCompare(b.principal, "pt-BR");
      }
      return a.codigo.localeCompare(b.codigo, "pt-BR");
    });
  }

  function renderizarAlertaMultiplos(termo, grupos) {
    if (grupos.length <= 1) return "";

    /*
     * O vínculo continua sendo utilizado internamente para expandir,
     * ordenar e separar os resultados, mas não é exibido na interface.
     */
    const nomes = grupos.map(
      grupo => "<strong>" + esc(grupo.codigo) + "</strong>"
    );

    return (
      '<div class="multi-thermo-alert" role="alert">' +
        
          "</strong> Dados em " + grupos.length + " termômetros: " +
          nomes.join(", ") + ". Os resultados foram separados abaixo.</div>" +
        "</div>" +
      "</div>"
    );
  }

  function renderizarSecaoTermometro(grupo) {
    const n = grupo.itens.length + " trecho" + (grupo.itens.length !== 1 ? "s" : "");

    const trs = grupo.itens.map(item => {
      const cls = isRemodelado(item) ? ' class="row-remodelado"' : "";

      return (
        "<tr" + cls + ">" +
          "<td><strong>" + esc(item.corredor) + "</strong></td>" +
          "<td>" + esc(item.trecho) + dtqInlineTag(item) + "</td>" +
          "<td>" + rondaTag(item) + "</td>" +
        "</tr>"
      );
    }).join("");

    return (
      '<div class="section-card thermo-section" data-termometro="' + esc(grupo.codigo) + '">' +
        '<div class="section-header">' +
          '<span style="font-size:18px">🌡️</span>' +
          '<div class="section-header-title-wrap">' +
            '<div class="section-header-title">Termômetro ' +
              '<span class="thermo-chip">' + esc(grupo.codigo) + "</span>" +
            "</div>" +
          "</div>" +
          '<span class="section-count">' + n + "</span>" +
        "</div>" +
        '<div class="table-wrap"><table>' +
          "<thead><tr><th>Corredor</th><th>Trecho (SB)</th><th>Ronda / Situação</th></tr></thead>" +
          "<tbody>" + trs + "</tbody>" +
        "</table></div>" +
        '<div class="legend">' +
          '<div class="legend-item"><span class="tag tag-remodelado" style="padding:3px 9px;font-size:.72rem">🔵 Trecho Remodelado</span> Sem inspeção necessária</div>' +
          '<div class="legend-item"><span class="tag tag-ok" style="padding:3px 9px;font-size:.72rem">🚆 Necessário ronda</span> Ronda ao atingir temperatura indicada</div>' +
          '<div class="legend-item"><span class="dtq-badge" style="width:26px;height:26px;font-size:.72rem;display:inline-flex;align-items:center;justify-content:center">DTQ</span> Verificar comunicação do equipamento</div>' +
        "</div>" +
      "</div>"
    );
  }

  function buscar() {
    const termo = normalizarTexto(document.getElementById("termometro").value);
    const out = document.getElementById("resultado");
    const statRow = document.getElementById("statsRow");

    if (!termo) {
      out.innerHTML = "";
      statRow.style.display = "none";
      return;
    }

    const resultado = encontrarResultados(termo);

    if (resultado.length === 0) {
      statRow.style.display = "none";
      out.innerHTML =
        '<div class="section-card"><div class="empty-state">' +
          '<div class="empty-icon">🔍</div>' +
          '<div class="empty-title">Nenhum resultado encontrado</div>' +
          '<div class="empty-desc">O termo <strong>' + esc(termo) +
          "</strong> não foi localizado na base de dados.<br>Verifique a sigla e tente novamente.</div>" +
        "</div></div>";
      return;
    }


    const grupos = agruparPorTermometro(resultado);
    const remodelados = resultado.filter(isRemodelado);
    const comRonda = resultado.filter(x => !isRemodelado(x));

    document.getElementById("statTotal").textContent = resultado.length;
    document.getElementById("statRemodelado").textContent = remodelados.length;
    document.getElementById("statOk").textContent = comRonda.length;
    statRow.style.display = "flex";

    out.innerHTML =
      renderizarAlertaMultiplos(termo, grupos) +
      grupos.map(renderizarSecaoTermometro).join("");
  }

  function limpar() {
    document.getElementById("termometro").value = "";
    document.getElementById("resultado").innerHTML = "";
    document.getElementById("statsRow").style.display = "none";
    document.getElementById("termometro").focus();
  }

  function abrirSeletorProcedimento() {
    document.getElementById("procedimentoModal").style.display = "flex";
  }

  function fecharSeletorProcedimento() {
    document.getElementById("procedimentoModal").style.display = "none";
  }

  function abrirProcedimento(arquivo) {
    window.open(arquivo, "_blank", "noopener,noreferrer");
    fecharSeletorProcedimento();
  }

  document.getElementById("procedimentoModal").addEventListener("click", function(e) {
    if (e.target.id === "procedimentoModal") fecharSeletorProcedimento();
  });

  document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") fecharSeletorProcedimento();
  });

  document.getElementById("termometro").addEventListener("keypress", function(e) {
    if (e.key === "Enter") buscar();
  });

  carregarDados();
</script>

</body>
